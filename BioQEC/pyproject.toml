[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioqec-prototype"
version = "0.2.0"
description = "Protótipo reprodutível para códigos de superfície e ruído não estacionário do BioQEC"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Fabrício Kleinicke Gomes"}]
dependencies = [
  "stim==1.16.0",
  "pymatching==2.4.0",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "jupyter>=1.0,<2",
  "nbformat>=5.9,<6",
  "nbclient>=0.10,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["circuits*", "noise*", "decoders*", "experiments*", "monitoring*", "metrics*", "features*", "selection*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
